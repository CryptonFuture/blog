<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700,800,900" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center align-items-center">
            <div class="col-12 col-md-5">
                <div class="card">
                    <div class="card-header">
                        <h6>Verify Otp</h6>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="">Email Address</label>
                            <input id="email-address" class="form-control" type="email" placeholder="email address..."  />
                        </div>

                         <div class="mb-3">
                            <label for="">Otp</label>
                            <input id="verify-otp" class="form-control" type="text" placeholder="otp..."  />
                        </div>

                        <p id="timer" style="font-weight: bold; color: #007bff;"></p>

                        <button onclick="resendOtp()" id="resend-btn" class="btn btn-warning mt-2" style="display: none;">
                            🔁 Resend OTP
                        </button>

                        <button onclick="verifyOtp()" class="btn btn-primary">submit</button>
                    </div>
                </div>
                
            </div>
        </div>
    </div>
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
  <script src="./js/verifyOtp.js"></script>
  
</body>
</html>
