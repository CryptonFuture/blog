      document.querySelectorAll('.nav-link').forEach(link => {
        link.addEventListener('click', function (e) {
          e.preventDefault();
          const pageId = this.getAttribute('href').substring(1); // # hatane ke liye
          showPage(pageId);
        });

    // Content show karne wala function
    function showPage(pageId) {
      // Content area mein template daal do
      document.getElementById('main-content').innerHTML = pageTemplates[pageId] || '<h2>Page Not Found</h2>';

      // Active link highlight karo
      document.querySelectorAll('.nav-link').forEach(link => {
        link.parentElement.classList.remove('active');
      });
      document.querySelector(`a[href="#${pageId}"]`).parentElement.classList.add('active');
    }
